<div class="table-responsive">
  <table class="table table-hover table-sm align-middle{% if paginate %} history-paginated-table{% endif %}"
         {% if paginate %}id="{{ table_id }}" data-page-size="20"{% endif %}>
    <thead>
      <tr>
        <th>Time</th>
        <th>Duration</th>
        <th>Symbol</th>
        <th>Dir</th>
        <th>Status</th>
        <th>Qty</th>
        <th>Entry</th>
        <th>PnL</th>
        <th>PnL %</th>
        <th>TP</th>
        <th>SL</th>
        <th>DCA</th>
        <th>Lev</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
        {% include "partials/history_row.html" %}
      {% empty %}
      <tr><td colspan="14" class="text-center text-muted">No records</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% if paginate and rows %}
<nav class="history-pagination d-flex justify-content-between align-items-center mt-2" data-target="{{ table_id }}" style="display:none;">
  <div class="text-muted small history-pagination-info"></div>
  <div class="btn-group btn-group-sm" role="group">
    <button type="button" class="btn btn-outline-secondary history-page-prev">Previous</button>
    <span class="btn btn-outline-secondary disabled history-page-indicator"></span>
    <button type="button" class="btn btn-outline-secondary history-page-next">Next</button>
  </div>
</nav>
{% endif %}
