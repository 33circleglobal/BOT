<ul class="nav nav-pills mb-3" id="{{ prefix }}-status-tabs" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="{{ prefix }}-open-tab" data-bs-toggle="pill" data-bs-target="#{{ prefix }}-open-pane" type="button" role="tab">
      Open <span class="badge bg-info text-dark ms-1">{{ counts.open }}</span>
    </button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="{{ prefix }}-position-tab" data-bs-toggle="pill" data-bs-target="#{{ prefix }}-position-pane" type="button" role="tab">
      Position <span class="badge bg-warning text-dark ms-1">{{ counts.position }}</span>
    </button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="{{ prefix }}-closed-tab" data-bs-toggle="pill" data-bs-target="#{{ prefix }}-closed-pane" type="button" role="tab">
      Closed <span class="badge bg-success ms-1">{{ counts.closed }}</span>
    </button>
  </li>
</ul>
<div class="tab-content">
  <div class="tab-pane fade show active" id="{{ prefix }}-open-pane" role="tabpanel">
    {% with rows=buckets.open %}{% include "partials/history_table.html" %}{% endwith %}
  </div>
  <div class="tab-pane fade" id="{{ prefix }}-position-pane" role="tabpanel">
    {% with rows=buckets.position %}{% include "partials/history_table.html" %}{% endwith %}
  </div>
  <div class="tab-pane fade" id="{{ prefix }}-closed-pane" role="tabpanel">
    {% with rows=buckets.closed %}{% include "partials/history_table.html" %}{% endwith %}
  </div>
</div>
